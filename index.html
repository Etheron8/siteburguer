<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>siteburguer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <h1 class="app__title">siteburguer</h1>
        <p class="app__objective">vai ser uma landpage one page de delivery de lanches pode gerar images ou pegar do google e deixar aba de produtos</p>
        <div class="calculator">
            <output id="display" class="calculator__display" data-testid="display">0</output>
            <div class="calculator__keys">
                <button type="button" class="key" data-action="clear">AC</button>
                <button type="button" class="key" data-action="delete">&#9003;</button>
                <button type="button" class="key" data-action="percent">%</button>
                <button type="button" class="key" data-action="divide">&divide;</button>

                <button type="button" class="key" data-number="7">7</button>
                <button type="button" class="key" data-number="8">8</button>
                <button type="button" class="key" data-number="9">9</button>
                <button type="button" class="key" data-action="multiply">&times;</button>

                <button type="button" class="key" data-number="4">4</button>
                <button type="button" class="key" data-number="5">5</button>
                <button type="button" class="key" data-number="6">6</button>
                <button type="button" class="key" data-action="subtract">&minus;</button>

                <button type="button" class="key" data-number="1">1</button>
                <button type="button" class="key" data-number="2">2</button>
                <button type="button" class="key" data-action="add">+</button>
                <button type="button" class="key" data-number="3">3</button>

                <button type="button" class="key" data-number="0">0</button>
                <button type="button" class="key" data-action="decimal">,</button>
                <button type="button" class="key key--wide" data-action="equal">=</button>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
